<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>猜單字小遊戲</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 text-center min-h-screen flex flex-col items-center justify-center text-2xl sm:text-3xl">

  <!-- 開始畫面 -->
  <div id="start-screen" class="space-y-10">
    <h1 class="text-4xl sm:text-6xl font-bold text-blue-700">Vocabulary Game</h1>
    <button id="start-btn" onclick="startGame()" class="bg-blue-500 text-white px-12 py-8 text-4xl rounded-full shadow hover:bg-blue-600 transition">
      Game Start!
    </button>
  </div>

  <!-- 遊戲區 -->
  <div id="game" class="hidden w-full max-w-xl mx-auto p-6 space-y-8">
    <!-- 重聽按鈕 -->
    <button onclick="replay()" class="text-5xl bg-yellow-300 rounded-full px-6 py-4 shadow hover:bg-yellow-400 transition">
      🔊
    </button>

    <!-- 選項按鈕 -->
    <div id="options" class="grid grid-cols-1 sm:grid-cols-3 gap-6 justify-center mt-6">
      <!-- 選項會自動產生 -->
    </div>

    <!-- 結果訊息 -->
    <div id="message" class="text-5xl font-bold mt-6 min-h-[3rem]"></div>
  </div>

  <script>
    const words = [
      "Apple", "Ant", "Bird", "Cat", "Dog", "Egg",
      "Elephant", "Fish", "Net", "Nose", "Pig",
      "Quilt", "Rabbit", "Sun", "Lion", "Monkey"
    ];

    let currentWord = null;

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('message').textContent = '';
      loadQuestion();
    }

    function loadQuestion() {
      currentWord = words[Math.floor(Math.random() * words.length)];
      speak(currentWord);

      let choices = [currentWord];
      while (choices.length < 3) {
        const choice = words[Math.floor(Math.random() * words.length)];
        if (!choices.includes(choice)) choices.push(choice);
      }
      choices = shuffle(choices);

      const container = document.getElementById('options');
      container.innerHTML = '';
      choices.forEach(choice => {
        const imgName = choice.toLowerCase();

        const btn = document.createElement('button');
        btn.innerHTML = `
          <img 
            src="letter_image/${imgName}.png" 
            alt="${choice}" 
            class="w-24 h-24 sm:w-32 sm:h-32 object-contain mb-2"
          >
          <div>${choice}</div>
        `;
        btn.className = `
          text-3xl sm:text-4xl
          bg-white rounded-3xl
          px-6 py-8
          shadow hover:bg-blue-200 transition
          w-full min-h-[10rem]
          break-words
          whitespace-normal
          flex flex-col justify-center items-center
        `;

        btn.onclick = () => {
          if (choice === currentWord) {
            document.getElementById('message').textContent = "🎉 通關！";
            document.getElementById('message').classList.remove("text-red-500");
            document.getElementById('message').classList.add("text-green-600");
          } else {
            document.getElementById('message').textContent = "❌ 錯了！再接再厲";
            document.getElementById('message').classList.remove("text-green-600");
            document.getElementById('message').classList.add("text-red-500");
          }

          setTimeout(() => {
            document.getElementById('game').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
          }, 1500);
        };

        container.appendChild(btn);
      });
    }

    function replay() {
      if (currentWord) {
        speak(currentWord);
      }
    }
  </script>

</body>
</html>
